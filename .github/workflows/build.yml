name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (the Lean toolchain manager)
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the prebuilt Mathlib
        run: lake exe cache get
      - name: Build
        run: lake build
      - name: No sorry, no axioms beyond Mathlib's
        run: |
          ! grep -rnw sorry Crush/
          printf 'import Crush\n#print axioms Crush.exists_weights\n#print axioms Crush.Design.exists_proportional_iff\n' > Axioms.lean
          lake env lean Axioms.lean | tee axioms.txt
          test -s axioms.txt
          ! grep -v -E "^'Crush\.[A-Za-z_.]+' depends on axioms: \[propext, Classical\.choice, Quot\.sound\]$" axioms.txt
